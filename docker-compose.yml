services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    # Only the HOST side of each port mapping is configurable (set in .env).
    # Containers reach each other over the Docker network on the FIXED internal
    # ports below, so changing a host port never breaks inter-service wiring.
    ports:
      # Default matches start.sh (5432 is commonly taken). Override via start.sh
      # or env. Keeping the default in sync with start.sh means a bare
      # `docker compose` command won't try to rebind a different port.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
      - ./qdrant_init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    environment:
      QDRANT_API_KEY: ""
    networks:
      - app_network

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    volumes:
      # Bind-mount the user's home dir at the SAME path inside the container.
      # This lets the UI accept any host path under $HOST_HOME/... and the
      # backend can open it with no translation. Override HOST_HOME in .env
      # per machine.
      - ${HOST_HOME:?HOST_HOME is required — copy .env.example to .env and set it}:${HOST_HOME}
      - torch_cache:/root/.cache/torch
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_db
      QDRANT_URL: http://qdrant:6333
      TRASH_DIR: ${TRASH_DIR:-${HOST_HOME}/.photo-gaze-trash}
      # Absolute base URL the browser uses to fetch thumbnails — must match the
      # host-published backend port so links don't 404 when FASTAPI_PORT changes.
      BACKEND_PUBLIC_URL: http://localhost:${FASTAPI_PORT:-8000}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  react:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      # Baked into the static bundle at build time (the runtime env below is a
      # no-op for an already-built bundle). Derived from FASTAPI_PORT so the UI
      # talks to the backend's host-published port.
      args:
        REACT_APP_API_URL: http://localhost:${FASTAPI_PORT:-8000}
        REACT_APP_WS_URL: ws://localhost:${FASTAPI_PORT:-8000}
    container_name: react_app
    ports:
      - "${REACT_PORT:-3001}:3000"
    depends_on:
      - fastapi
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local
  qdrant_storage:
    driver: local
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local
  torch_cache:
    driver: local

networks:
  app_network:
    driver: bridge
