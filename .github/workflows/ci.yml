name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  # The frontend suite had silently rotted because nothing ran it. This job is
  # the guard: it fails the build if the React/TS tests break.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  # Backend: the maintained, hermetic (mocked) test files. The full suite has
  # pre-existing torch/live-service-dependent failures that aren't in scope
  # here; this list is the green core and should stay green.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies (torch-free; tests mock embedding)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-native.txt -r requirements-dev.txt
      - name: Run maintained backend tests
        run: |
          pytest -o addopts="" -q \
            tests/test_audit_fixes.py \
            tests/test_slider_perf.py \
            tests/test_backup_manager.py \
            tests/test_similarity_matrix.py \
            tests/test_similarity_endpoints.py \
            tests/test_job_queue.py \
            tests/test_auto_deduplicate.py \
            tests/test_native_launcher.py \
            tests/test_folder_scanner_incremental.py
